<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bathroom Planner 3D</title>
    <meta name="description" content="Design your dream bathroom in minutes. Drag and drop fixtures, visualise in 3D, and plan your perfect layout with our free online bathroom planner."/>


    <!-- Your custom favicon -->
    <link rel="icon" type="image/png" href="/assets/favIcon/bath-mountain-180x180.png">

    <!-- Apple Touch Icon (perfect size for your 180x180 image) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favIcon/bath-mountain-180x180.png">

    <!-- For older browsers that expect .ico format -->
    <link rel="shortcut icon" href="/assets/favIcon/bath-mountain-180x180.png">

    <!-- Preload LCP images -->
    <link rel="preload" as="image" href="/assets/logo.svg" type="image/svg+xml" fetchpriority="high">
    <link rel="preload" as="image" href="/assets/home-banner.webp" type="image/webp">

    <!-- Theme color to match your app -->
    <meta name="theme-color" content="#29275B">

    <!-- MS Tile color (for Windows) -->
    <meta name="msapplication-TileColor" content="#29275B">
    <meta name="msapplication-TileImage" content="/assets/favIcon/bath-mountain-180x180.png">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
